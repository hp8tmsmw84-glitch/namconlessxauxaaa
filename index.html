<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tri Ân Ngày Nhà Giáo Việt Nam 20/11</title>
    <style>
        /* Cài đặt chung */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #fdfbf7;
        }
        
        /* Phần Header / Banner */
        header {
            background: linear-gradient(135deg, #c0392b, #e67e22);
            color: #fff;
            text-align: center;
            padding: 60px 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        header p {
            font-size: 1.2rem;
            font-style: italic;
            opacity: 0.9;
        }

        /* Thanh điều hướng */
        nav {
            background-color: #fff;
            padding: 15px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        nav a {
            color: #c0392b;
            text-decoration: none;
            font-weight: bold;
            margin: 0 15px;
            font-size: 1.05rem;
            transition: color 0.3s;
        }
        nav a:hover {
            color: #e67e22;
        }

        /* Khung chứa nội dung chính */
        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }
        section {
            background: #fff;
            padding: 35px;
            margin-bottom: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h2 {
            color: #c0392b;
            border-bottom: 2px solid #f39c12;
            padding-bottom: 10px;
            margin-bottom: 20px;
            font-size: 1.8rem;
        }

        /* Phần Lịch sử hình thành */
        .timeline {
            list-style: none;
            padding-left: 20px;
            border-left: 3px solid #e67e22;
        }
        .timeline li {
            margin-bottom: 20px;
            position: relative;
        }
        .timeline li::before {
            content: '✿';
            position: absolute;
            left: -29px;
            top: 0;
            color: #c0392b;
            background: #fff;
            font-size: 1.2rem;
        }
        .timeline strong {
            color: #d35400;
            font-size: 1.1rem;
        }

        /* Phần Thư viện hình ảnh */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }
        .gallery-item {
            overflow: hidden;
            border-radius: 8px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.1);
            background: #fafafa;
            text-align: center;
        }
        .gallery-item img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
        }
        .gallery-item img:hover {
            transform: scale(1.05);
        }
